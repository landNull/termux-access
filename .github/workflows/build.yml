name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true
      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew; skeleton only"
          fi
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # Free automated protocol test helper (runs when a public or forwarded URL is available).
  # On a device/emulator use: adb reverse tcp:8080 tcp:8080 && ./scripts/test-webdav.sh http://127.0.0.1:8080/
  protocol-test:
    runs-on: ubuntu-latest
    if: false  # Enable manually or when a test server is reachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free webdav-tck
        run: pip install webdav-tck
      - name: Run compliance suite
        run: dav-tck --suites=basic "${{ secrets.WEBDAV_TEST_URL }}"
